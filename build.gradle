// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    apply from: rootProject.file('gradle/dependencies.gradle')
    apply from: rootProject.file('kotlin-android/gradle/dependencies.gradle')

    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven {
            url kotlin_repo_url
        }
    }

    dependencies {
        classpath plugin.androidGradle
        classpath plugin.androidx.navigation.safeArgs
        classpath plugin.google.hilt
        classpath plugin.gradleVersions
        classpath plugin.kotlin.gradle
        // classpath plugin.square.exhaustive
        classpath plugin.square.sqlDelight
        classpath "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
        maven { url 'https://jitpack.io' }
        maven { url "https://chaquo.com/maven" }
        maven {
            url kotlin_repo_url
        }
    }

    tasks.withType(Test) {
        maxHeapSize = "4096m"
        testLogging {
            exceptionFormat "full"
            events "started", "skipped", "passed", "failed"
            showStandardStreams true
        }
    }

    plugins.withId("com.android.library") {
        extensions.getByName("android").compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }

    plugins.withId("kotlin") {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_1_8
            languageVersion = kotlin_language_version
            logger.info("""[COMMUNITY_PROJECT_BUILD] Configured Kotlin Language version: '$languageVersion' for project ${project.name} """)
            apiVersion = kotlin_api_version
            logger.info("""[COMMUNITY_PROJECT_BUILD] Configured Kotlin Api version: '$apiVersion' for project ${project.name} """)
            freeCompilerArgs += [
                    "-Xinline-classes",
                    "-opt-in=kotlin.RequiresOptIn",
                    '-opt-in=kotlin.time.ExperimentalTime',
                    '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                    //moschi and dagger are metadata-incompatible with 1.9
                    '-Xmetadata-version=1.8',
                    '-Xrender-internal-diagnostic-names'
            ]
        }
    }
}

// EngineIO Modules (for tests)
ext.nodeVersion = "14.15.4"
ext.nodeWorkDir = "$rootDir/.gradle/nodejs"

task clean(type: Delete) {
    delete rootProject.buildDir
}

////////////////////////////////////////////////////////////////////////////
/// Gradle Versions: https://github.com/ben-manes/gradle-versions-plugin ///
////////////////////////////////////////////////////////////////////////////

apply plugin: 'com.github.ben-manes.versions'

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    checkForGradleUpdate = true

    // Example 1: reject all non stable versions
    rejectVersionIf {
        isNonStable(candidate.version)
    }

    // Example 2: disallow release candidates as upgradable versions from stable versions
    rejectVersionIf {
        isNonStable(candidate.version) && !isNonStable(currentVersion)
    }

    // Example 3: using the full syntax
    resolutionStrategy {
        componentSelection {
            all {
                if (isNonStable(candidate.version) && !isNonStable(currentVersion)) {
                    reject('Release candidate')
                }
            }
        }
    }
}
